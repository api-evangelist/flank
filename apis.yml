name: Flank
description: 'Flank builds AI agents for enterprise legal teams that handle high-volume, routine
  legal work autonomously. Its supervised agents operate like paralegals, taking in requests via
  email or portals, executing contracting tasks against an organization''s own templates and playbooks,
  and returning completed work for lawyer review. The platform covers drafting, contract review,
  negotiation, and triage, letting legal departments insource repetitive work while lawyers supervise
  finished output and high-risk items. Flank is backed by HV Capital, Insight Partners, and Speedinvest,
  and is SOC 2 Type 2, ISO 42001, GDPR, and CCPA compliant.'
